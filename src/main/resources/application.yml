spring:
  config:
    import:
      optional:file:.env[.properties]
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    mongodb:
      uri: ${MONGO_URI}
      database: ${MONGO_DB}

    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

            # Spring Session Redis 제거 - JWT stateless 인증 사용
          # session:
          #   store-type: redis
          #   redis:
          #     namespace: spring:session
          #     flush-mode: on_save
          #   timeout: 30m
          
          # 마이그레이션 설정
          migration:
            auto:
              enabled: false  # true로 설정하면 애플리케이션 시작 시 자동 마이그레이션

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}"
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: chat-consumer


libretranslate:
  host: ${LIBER_HOST}
  port: ${LIBER_PORT}

gemini:
  base-url: https://generativelanguage.googleapis.com/v1beta
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite} # 무료 모델 설정에따라변경
  api-key: ${GEMINI_API_KEY}
  timeout-seconds: 10

springdoc:
  api-docs:
    path: /v3/api-docs            # ✏️ JSON 스펙 엔드포인트
  swagger-ui:
    path: /swagger-ui.html        # ✏️ UI 진입점
    operations-sorter: method
    tags-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json


jwt:
  secret: ${JWT_SECRET}

front:
  url: ${FRONT_URL:https://howareu.click}
  cors:
    allowed-origins:
      - ${FRONT_URL:https://howareu.click}
      - https://howareu.click
      - https://www.howareu.click
      - http://localhost:3000  # React 개발 서버
      - http://localhost:5173  # Vite 개발 서버
      - http://localhost:8080  # 기본 개발 서버

logging:
  level:
    org.springframework.boot.context.config: DEBUG

nlp:
  base-url: http://localhost:8000         # 기존 분석 서비스(NlpClient)
tagging-nlp:
  base-url: http://localhost:8001         # 새 태깅 서비스(FastAPI analysisTag.py)

migration:
  auto:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, metrics
  prometheus:
    metrics:
      export:
        enabled: true
